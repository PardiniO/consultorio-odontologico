<div class="odontologo-card">
    <div class="odontologo-card__header">
        <img src="doctor.png" alt="profile-pic">
        <p> {{ doctor.nombre }} {{ doctor.apellido }} </p>
        <p> {{ doctor.rol }} </p>
    </div>
    <div class="odontologo-card__buttons">
        <button (click)="modificarCard()">Modificar</button>
        <button (click)="eliminarDoctor(doctor.id_doctor)">Eliminar</button>
    </div>
</div>
