<div class="wrapper">
    <app-header
        [titulo]="'Gestor de odontologos'"
    >
        <app-search-bar
            [placeholderText]="'Buscar odontologos...'"
            (searchEvent)="handleSearch($event)">
        </app-search-bar>
    </app-header>
    <div class="content">
        <div class="content__doctors-manager">
            <div class="content__doctors-section">
                <div class="content__doctors" *ngIf="!panelModificarDoctorVisible && !panelCrearDoctorVisible">
                    <app-odontologo-card *ngFor="let d of doctores" [doctor]="d" (modificar)="selectDoctor($event)" (eliminar)="remove($event)"></app-odontologo-card>
                </div>
                <div class="content__modify-doctor" *ngIf="panelModificarDoctorVisible">
                    <app-odontologo-modificar *ngIf="doctorSeleccionado" [doctorSeleccionado]="doctorSeleccionado" (salir)="togglePannel()" (modificar)="update($event)"></app-odontologo-modificar>
                </div>
                <app-odontologo-alta *ngIf="panelCrearDoctorVisible" (salir)="togglePannel2()" (crearDoctor)="create($event)"></app-odontologo-alta>
            </div>
        </div>
    </div>
</div>
