<div class="wrapper">
    <app-header [titulo]="'Gestor de odontologos'">
        <app-search-bar
            [placeholderText]="'Buscar doctores...'"
            (searchEvent)="handleSearch($event)">
        </app-search-bar>

        <div class="content__actions" *ngIf="! panelModificarDoctorVisible && !panelCrearDoctorVisible">
            <button class="create-btn" (click)="toggleCrearPanel()">+</button>
        </div>
    </app-header>

    <div class="content">
        <div class="content__doctors-manager">
            <div class="content__doctors-section" [ngStyle]="{ 'height' : panelCrearDoctorVisible ? '90vh' : '80vh' }">
                
                <div class="content__doctors" *ngIf="! panelModificarDoctorVisible && !panelCrearDoctorVisible">
                    <app-odontologo-card 
                        *ngFor="let d of doctores" 
                        [doctor]="d" 
                        (modificar)="selectDoctor($event)" 
                        (eliminar)="remove($event)">
                    </app-odontologo-card>
                </div>
                
                <div class="content__modify-doctor" *ngIf=" panelModificarDoctorVisible">
                    <app-odontologo-modificar 
                        *ngIf="doctorSeleccionado" 
                        [doctorSeleccionado]="doctorSeleccionado" 
                        (salir)="toggleModificarPanel()" 
                        (modificar)="update($event)">
                    </app-odontologo-modificar>
                </div>
                
                <div class="content__create-doctor" *ngIf="panelCrearDoctorVisible">
                    <app-odontologo-alta
                        (salir)="toggleCrearPanel()" 
                        (crearDoctor)="create($event)">
                    </app-odontologo-alta>
                </div>
            </div>
        </div>
    </div>
</div>
