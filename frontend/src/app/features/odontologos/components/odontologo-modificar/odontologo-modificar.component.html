<div class="modify-form">
    <div class="modify-form__field-container">
        <label for="name">Nombre:</label>
        <input id="name" type="text" placeholder="Ej: Jhon" [(ngModel)]="doctorSeleccionado.nombre">
    </div>
    <div class="modify-form__field-container">
        <label for="surname">Apellido:</label>
        <input id="surname" type="text" placeholder="Ej: Doe" [(ngModel)]="doctorSeleccionado.apellido">
    </div>
    <div class="modify-form__field-container">
        <label for="speciality">Especialidad:</label>
        <select name="speciality" id="speciality" [(ngModel)]="doctorSeleccionado.rol">
            <option value="Endodoncista">Endodoncista</option>
            <option value="Ortodoncista">Ortodoncista</option>
        </select>
    </div>
    <div class="modify-form__buttons">
        <button (click)="enviarModificacion()"
            [disabled]="doctorSeleccionado.nombre === '' || doctorSeleccionado.apellido === ''">Modificar</button>
        <button (click)="cerrar()">Salir</button>
    </div>
</div>
