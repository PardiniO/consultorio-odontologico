<app-header [titulo]="'Pacientes'">
    <app-search-bar
        [placeholderText]="'Buscar pacientes...'"
        (searchEvent)="handleSearch($event)">
    </app-search-bar>
    
    <div class="content__actions " *ngIf="!panelModificarPacienteVisible && !panelCrearPacienteVisible">
        <button class="create-btn" (click)="toggleCrearPanel()">+</button>
    </div>
</app-header>

<div class="content">
    <div class="content__patients-manager">
        <div class="content__patients-section" [ngStyle]="{ 'height' : panelCrearPacienteVisible ? '90vh' : '79vh' }">
            
            <div class="content__patients" *ngIf="!panelModificarPacienteVisible && !panelCrearPacienteVisible">
                <app-paciente-card 
                    *ngFor="let p of pacientes" 
                    [paciente]="p" 
                    (modificar)="selectPatient($event)"
                    (eliminar)="remove($event)">
                </app-paciente-card>
            </div>

            <div class="content__modify-patients" *ngIf="panelModificarPacienteVisible">
                <app-paciente-modificar 
                    *ngIf="pacienteSeleccionado"
                    [pacienteSeleccionado]="pacienteSeleccionado"
                    (salir)="toggleModificarPanel()" 
                    (modificar)="update($event)">
                </app-paciente-modificar>
            </div>

            <div class="content__create-patients" *ngIf="panelCrearPacienteVisible">
                <app-paciente-alta 
                    (salir)="toggleCrearPanel()"
                    (crear)="create($event)">
                </app-paciente-alta>
            </div>
        </div>
    </div>
</div>
