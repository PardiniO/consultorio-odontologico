<div class="patient-card">
    <div class="patient-card__header">
        <img class="img-1" src="paciente.png" [alt]="paciente.nombre">
    </div>
    <div class="patient-card__body">
        <p class="patient-card__body--name"> {{ paciente.nombre }} {{ paciente.apellido }} </p>
        <div class="patient-card__birth-date">
            <img class="img-2" src="nacimiento.png" [alt]="paciente.fecha_nacimiento">
            <p class="patient-card__body--birth-date"> {{ paciente.fecha_nacimiento | date: 'mediumDate'}} </p>
        </div>
    </div>
</div>
