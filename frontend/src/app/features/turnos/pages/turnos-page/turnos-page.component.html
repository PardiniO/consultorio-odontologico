<app-header  [titulo]="'Gestión de turnos'">
    <div class="filtrosTurnos">
        <div class="filtro-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal preview-icon"><path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
        </div>
        <div class="filtrosTurnos__estado">
            <label for="estado">Estado</label>
            <select #estadoSelect name="estado" id="estado" (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="confirmado">Confirmado</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </div>
        <div class="filtrosTurnos__sala">
            <label for="sala">Sala</label>
            <select #salaSelect name="sala" id="sala" (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
                <option value="">Todas</option>
                <option value="A17">A17</option>
                <option value="A19">A19</option>
            </select>
        </div>
        <div class="filtrosTurnos__horario">
            <div class="horario-input-group">
                <label for="fechaDesde">Desde:</label>
                <input #fechaDesde type="date" id="fechaDesde" name="fechaDesde"
                        (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
            </div>
            
            <div class="horario-input-group">
                <label for="fechaHasta">Desde:</label>
                <input #fechaHasta type="date" id="fechaHasta" name="fechaHasta"
                        (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
            </div>
        </div>
    </div>

    <div class="content__actions" *ngIf="!panelModificarTurnoVisible && !panelCrearTurnoVisible">
        <button class="create-btn" (click)="toggleCrearPanel()">+</button>
    </div>
</app-header>

<div class="content">
    <div class="content__turnos-manager">
        <div class="content__turnos-section" [ngStyle]="{ 'height' : panelCrearTurnoVisible ? '90vh' : '79vh' }">
            
            <div class="content__turnos" *ngIf="!panelModificarTurnoVisible && !panelCrearTurnoVisible">
                <app-turno-card 
                    *ngFor="let t of turnos" 
                    [turno]="t" 
                    (modificar)="selectTurno($event)" 
                    (eliminar)="remove($event)">
                </app-turno-card>
            </div>
            
            <div class="content__modify-turno" *ngIf="panelModificarTurnoVisible">
                <app-turno-modificar 
                    *ngIf="turnoSeleccionado" 
                    [turnoSeleccionado]="turnoSeleccionado" 
                    (modificar)="update($event)" 
                    (salir)="toggleModificarPanel()">
                </app-turno-modificar>
            </div>

            <div class="content__create-turno" *ngIf="panelCrearTurnoVisible">
                <app-turno-alta 
                    (salir)="toggleCrearPanel()" 
                    (crear)="register($event)">
                </app-turno-alta>
            </div>
            <div class="content__create-turno" *ngIf="panelCrearTurnoVisible">
                <app-turno-alta *ngIf="panelCrearTurnoVisible" (salir)="toggleCrearPanel()" (crear)="register($event)"></app-turno-alta>
            </div>
        </div>
    </div>
</div>
