<app-header  [titulo]="'Gestión de turnos'">
    <app-search-bar
        [placeholderText]="'Buscar turnos...'"
        (searchEvent)="handleSearch($event)">

        <div class="filtrosTurnos">
            <div class="filtrosTurnos__estado">
                <label for="estado">Estado</label>
                <select name="estado" id="estado">
                    <option value="">Todos</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="confirmado">Confirmado</option>
                    <option value="cancelado">Cancelado</option>
                </select>
            </div>
            <div class="filtrosTurnos__sala">
                <label for="sala">Sala</label>
                <select name="sala" id="sala">
                    <option value="">Todas</option>
                    <option value="A17">A17</option>
                    <option value="A19">A19</option>
                </select>
            </div>
            <div class="filtrosTurnos__horario">
                <p>Desde: ...</p>
                <p>Hasta: ...</p>
            </div>
        </div>
    </app-search-bar>
</app-header>

<div class="content">
    <div class="content__turnos-manager">
        <div class="content__turnos-section">
            <div class="content__turnos" *ngIf="!panelModificarTurnoVisible && !panelCrearTurnoVisible">
                <app-turno-card *ngFor="let t of turnos" [turno]="t" (modificar)="selectTurno($event)" (eliminar)="remove($event)"></app-turno-card>
            </div>
            <div class="content__modify-turno" *ngIf="panelModificarTurnoVisible">
                <app-turno-modificar *ngIf="turnoSeleccionado" [turnoSeleccionado]="turnoSeleccionado" (modificar)="update($event)" (salir)="togglePannel()"></app-turno-modificar>
            </div>
            <app-turno-alta *ngIf="panelCrearTurnoVisible" (salir)="togglePannel2()" (crear)="create($event)"></app-turno-alta>
        </div>
    </div>
</div>
