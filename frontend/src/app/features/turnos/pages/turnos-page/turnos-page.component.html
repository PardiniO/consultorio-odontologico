<app-header *ngIf="!panelModificarTurnoVisible && !panelCrearTurnoVisible">
    <div class="filtrosTurnos" turnos>
        <div class="filtrosTurnos__estado">
            <label for="estado">Estado</label>
            <select #estadoSelect class="select" name="estado" id="estado" (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
                <option value="">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="confirmado">Confirmado</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </div>
        <div class="filtrosTurnos__sala">
            <label for="sala">Sala</label>
            <select #salaSelect class="select" name="sala" id="sala" (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
                <option value="">Todas</option>
                <option value="A17">A17</option>
                <option value="A19">A19</option>
            </select>
        </div>
        <div class="filtrosTurnos__horario">
            <div class="horario-input-group">
                <label for="fechaDesde">Desde:</label>
                <input #fechaDesde class="input-date" type="date" id="fechaDesde" name="fechaDesde"
                        (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
            </div>
            
            <div class="horario-input-group">
                <label for="fechaHasta">Hasta:</label>
                <input #fechaHasta class="input-date" type="date" id="fechaHasta" name="fechaHasta"
                        (change)="aplicarFiltros(estadoSelect.value, salaSelect.value, fechaDesde.value, fechaHasta.value)">
            </div>
        </div>
    </div>

    <div class="content__actions" turnos>
        <button class="create-btn" (click)="toggleCrearPanel()">+</button>
    </div>
</app-header>

<div class="content" [ngStyle]="{ 'height' : panelModificarTurnoVisible ? '100vh' : panelCrearTurnoVisible ? '100vh' : '90vh' }">
    <div class="content__turnos-manager">
        <div class="content__turnos-section">
            
            <div class="content__turnos" *ngIf="!panelModificarTurnoVisible && !panelCrearTurnoVisible">
                <app-turno-card 
                    *ngFor="let t of turnos" 
                    [turno]="t" 
                    (modificar)="selectTurno($event)" 
                    (eliminar)="remove($event)">
                </app-turno-card>
            </div>
            
            <div class="content__modify-turno" *ngIf="panelModificarTurnoVisible">
                <app-turno-modificar 
                    *ngIf="turnoSeleccionado" 
                    [turnoSeleccionado]="turnoSeleccionado" 
                    (modificar)="update($event)" 
                    (salir)="toggleModificarPanel()">
                </app-turno-modificar>
            </div>

            <div class="content__create-turno" *ngIf="panelCrearTurnoVisible">
                <app-turno-alta 
                    (salir)="toggleCrearPanel()" 
                    (crear)="register($event)">
                </app-turno-alta>
            </div>
        </div>
    </div>
</div>
