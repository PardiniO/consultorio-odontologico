<div class="turno-card" (click)="modificarTurno()">
    <div class="turno-card__header" [ngClass]="turno.estado"> {{ turno.horario | date: 'short' }} - {{ turno.estado }} </div>
    <div class="turno-card__body">
        <p>Sala: {{ turno.sala }}</p>
        <p>Razón: {{ turno.razon }}</p>
        <p>Descripción: {{ turno.descripcion }} </p>
    </div>
</div>
