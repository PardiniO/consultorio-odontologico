<div class="turno-card">
    <div class="turno-card__header" [ngClass]="turno.estado">
        {{ turno.horario | date: 'short' }} - {{ turno.estado }}
        <button class="delete-button" (click)="eliminarTurno()">X</button>
    </div>
    <div class="turno-card__body" (click)="modificarTurno()">
        <p>Sala: {{ turno.sala }}</p>
        <p>Razón: {{ turno.razon }}</p>
        <p>Descripción: {{ turno.descripcion }} </p>
    </div>
</div>
