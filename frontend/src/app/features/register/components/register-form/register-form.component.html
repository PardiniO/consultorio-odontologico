<div class="register-form">
    <div class="register-form__header">OdontoCare - Innovación dental, resultados visibles.</div>
    <div class="register-form__content">
        <div class="register-form__side-content">
            <form class="form">
                <div class="form__field">
                    <label for="name">Nombre:</label>
                    <input class="input-text" id="name" type="text" placeholder="Jhon">
                </div>
                <div class="form__field">
                    <label for="surname">Apellido:</label>
                    <input class="input-text" id="surname" type="text" placeholder="Doe">
                </div>
                <div class="form__field">
                    <label for="password">Contraseña:</label>
                    <input class="input-password" id="password" type="password" placeholder="12345678">
                </div>
                <div class="form__field">
                    <div class="form__field-button-container">
                        <input class="input-radio" id="name" type="radio" name="rol" value="paciente">
                        <p>Paciente</p>
                    </div>
                    <div class="form__field-button-container">
                        <input class="input-radio" id="name" type="radio" name="rol" value="doctor">
                        <p>Doctor</p>
                    </div>
                </div>
                <button class="create-account-button">Crear cuenta</button>
                <p>¿Tienes una cuenta?</p>
                <button class="login-button" routerLink="/login">Iniciar sesión</button>
            </form>
        </div>
    </div>
</div>
