<div class="login-form">
    <div class="login-form__header">OdontoCare - Innovación dental, resultados visibles.</div>
    <div class="login-form__content">
        <div class="login-form__side-content">
            <form class="form" (ngSubmit)="login()">
                <p>¡Bienvenido de vuelta!</p>
                <div class="form__field">
                    <label for="user">Usuario:</label>
                    <input class="input-text" id="user" name="usuario" type="text" placeholder="Nombre123"
                        [(ngModel)]="usuario" required>
                </div>
                <div class="form__field">
                    <label for="password">Contraseña:</label>
                    <input class="input-password" id="password" name="contraseña" type="password"
                        placeholder="12345678" [(ngModel)]="password" required>
                </div>
                <p *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
                <button class="login-button" type="submit" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Ingresando...' : 'Iniciar sesión' }}
                </button>
                <button class="back-button" type="button" routerLink="/">Volver</button>
            </form>
        </div>
    </div>
</div>
