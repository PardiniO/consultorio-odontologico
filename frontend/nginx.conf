server {
  listen 80;
  root /usr/share/nginx/html;

  # Las llamadas a /api/... se pasan al backend ("backend" es el nombre del servicio)
  location /api/ {
    proxy_pass http://backend:3000;
  }

  # Todo lo demás es la aplicación Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
